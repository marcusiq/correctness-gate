# Which spec the CI gate evaluates on a pull request.
# The demo PRs in M10 work by changing this single line.
under_test: smollm2-360m-q8

models:
  # ---- PR tier: 0.5B on CPU, small enough for a GitHub-hosted runner ----
  qwen0.5b-q4km:
    backend: llamacpp
    path: models/qwen2.5-0.5b-instruct-q4_k_m.gguf
    device: cpu
    url: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
  qwen0.5b-q8:
    backend: llamacpp
    path: models/qwen2.5-0.5b-instruct-q8_0.gguf
    device: cpu
    url: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q8_0.gguf
  qwen0.5b-q2k:
    backend: llamacpp
    path: models/qwen2.5-0.5b-instruct-q2_k.gguf
    device: cpu
    url: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q2_k.gguf

  # Demo candidate for a failing PR: a smaller model swapped in to cut serving
  # cost. Different model family, same items and execution config.
  smollm2-360m-q8:
    backend: llamacpp
    path: models/smollm2-360m-instruct-q8_0.gguf
    device: cpu
    url: https://huggingface.co/HuggingFaceTB/SmolLM2-360M-Instruct-GGUF/resolve/main/smollm2-360m-instruct-q8_0.gguf

  # ---- scorer validation: the exact configuration the lm-eval fixture used ----
  qwen0.5b-hf:
    backend: hf
    path: Qwen/Qwen2.5-0.5B-Instruct
    dtype: float32
    device: cpu

  # ---- local tier: quant-lab 3B artifacts (absolute paths, local only) ----
  qwen3b-f16:
    backend: llamacpp
    path: ~/quant-lab/results/qwen2.5-3b/gguf/model-f16.gguf
    device: cuda
  qwen3b-q8:
    backend: llamacpp
    path: ~/quant-lab/results/qwen2.5-3b/gguf/model-Q8_0.gguf
    device: cuda
  qwen3b-q4km:
    backend: llamacpp
    path: ~/quant-lab/results/qwen2.5-3b/gguf/model-Q4_K_M.gguf
    device: cuda
  qwen3b-q2k:
    backend: llamacpp
    path: ~/quant-lab/results/qwen2.5-3b/gguf/model-Q2_K.gguf
    device: cuda
  qwen3b-q2k-imatrix:
    backend: llamacpp
    path: ~/quant-lab/results/qwen2.5-3b/gguf/model-Q2_K-imatrix.gguf
    device: cuda
